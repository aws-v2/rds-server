name: Staging Deployment

on:
  push:
    branches: [ "staging" ]

jobs:
  staging-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Install libvirt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvirt-dev \
            libvirt-daemon \
            pkg-config
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Run tests
        run: go test ./... -v

  staging-build-image:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: staging-test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
              qarani/rds-server:staging-${{github.sha}}
              qarani/rds-server:staging

  staging-deploy:
    needs: staging-build-image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Staging via SSH over Tailscale.
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker network create aws-staging-network || true
            docker pull qarani/rds-server:staging-${{github.sha}}
            docker stop rds-server-staging || true
            docker rm rds-server-staging || true
            docker run -d --name rds-server-staging \
              --network aws-staging-network \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -p 8087:8087 \
              -e APP_PROFILE=STAGING \
              -e EUREKA_HOSTNAME=rds-server-staging \
              -e EUREKA_IP_ADDR=127.0.0.1 \
              -e RDS_PORT=8087 \
              -e DB_HOST=postgres-staging \
              -e DB_PORT=5432 \
              -e DB_USER=postgres-staging-user \
              -e DB_PASSWORD=postgres-staging-password \
              -e DB_NAME=rds_db2 \
              -e NATS_URL=nats://nats-staging:4222 \
              -e NATS_USERNAME=nats-staging-user \
              -e NATS_PASSWORD=nats-staging-password \
              -e EUREKA_SERVER_URL=http://discovery-server-staging:8761/eureka \
              -e PUBLIC_HOST_IP=192.168.1.7 \
              -e AWS_REGION=eu-north-1 \
              qarani/rds-server:staging-${{github.sha}}


