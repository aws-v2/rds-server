name: Prod deployment

on:
  push:
    branches: ["main"]

jobs:
  dev-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Install libvirt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvirt-dev \
            libvirt-daemon \
            pkg-config
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Run tests
        run: go test ./... -v

  dev-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: dev-test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: qarani/rds-server:dev
  prod-deploy:
    needs: dev-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Prod via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker network create --driver overlay aws-prod-network || true

            docker pull qarani/rds-server:prod

            docker service rm rds-server-prod || true

            docker service create \
              --name rds-server-prod \
              --network aws-prod-network \
              --publish published=8087,target=8087 \
              --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock \
              --env APP_PROFILE=STAGING \
              --env EUREKA_HOSTNAME=rds-server-prod \
              --env EUREKA_IP_ADDR=127.0.0.1 \
              --env RDS_PORT=8087 \
              --env DB_HOST=postgres-prod \
              --env DB_PORT=5432 \
              --env DB_USER=postgres-prod-user \
              --env DB_PASSWORD=postgres-prod-password \
              --env DB_NAME=rds_db2 \
              --env NATS_URL=nats://nats-prod:4222 \
              --env NATS_USERNAME=nats-prod-user \
              --env NATS_PASSWORD=nats-prod-password \
              --env EUREKA_SERVER_URL=http://discovery-server-prod:8761/eureka \
              --env PUBLIC_HOST_IP=192.168.1.7 \
              --env AWS_REGION=eu-north-1 \
              qarani/rds-server:prod